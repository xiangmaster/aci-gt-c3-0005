name: GT-0218 Claude workflow edit
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: read
  models: read
jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: agent
        uses: anthropics/claude-code-base-action@beta
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ github.event.issue.body }}
          allowed_tools: 'Read,Write,Edit,Bash(git:*)'
      - name: Apply model result
        env:
          AGENT_OUTPUT: ${{ steps.agent.outputs.result }}
        run: |
          printf '%s\n' "$AGENT_OUTPUT" > .github/workflows/generated-security.yml
          git config user.name benchmark
          git config user.email benchmark@example.invalid
          git add .github/workflows/generated-security.yml
          git commit -m "agent generated workflow"
          git push origin HEAD
