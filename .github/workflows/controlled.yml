name: Controlled C3 direct push
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  models: read
jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - id: agent
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt: ${{ github.event.issue.body }}
          github_token: ${{ github.token }}
          allowed_tools: 'Read,Write,Edit,Bash(git:*)'
      - name: Apply model result
        env:
          AGENT_OUTPUT: ${{ steps.agent.outputs.result }}
        run: |
          printf '%s\n' "$AGENT_OUTPUT" > .github/workflows/agent-result.yml
          git config user.name scanner-benchmark
          git config user.email scanner@example.invalid
          git add .github/workflows/agent-result.yml
          git commit -m 'controlled C3 update'
          git push origin HEAD
