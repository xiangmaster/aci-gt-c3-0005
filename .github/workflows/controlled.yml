name: GT-0218 AI output workflow edit
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: read
  models: read
jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: agent
        uses: actions/ai-inference@v2
        with:
          model: openai/gpt-4o-mini
          prompt: ${{ github.event.issue.body }}
      - name: Apply model result
        env:
          AGENT_OUTPUT: ${{ steps.agent.outputs.response }}
        run: |
          printf '%s\n' "$AGENT_OUTPUT" > .github/workflows/generated-security.yml
          git config user.name benchmark
          git config user.email benchmark@example.invalid
          git add .github/workflows/generated-security.yml
          git commit -m "agent generated workflow"
          git push origin HEAD
